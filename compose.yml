services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: getyourgigs
      POSTGRES_USER: gyg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyg -d getyourgigs"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=database;Database=getyourgigs;Username=gyg;Password=${POSTGRES_PASSWORD:-local-development}
      Jwt__Key: ${Jwt__Key:-local-compose-development-key-replace-for-production-123456789}
      Google__ClientId: ${Google__ClientId:-}
      Smtp__Host: ${Smtp__Host:-}
      Smtp__Port: ${Smtp__Port:-587}
      Smtp__User: ${Smtp__User:-}
      Smtp__Password: ${Smtp__Password:-}
      Smtp__From: ${Smtp__From:-Get Your Gigs <hello@getyourgigs.example>}
    command: ["--seed"]
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - uploads:/app/.data
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres-data:
  uploads:
