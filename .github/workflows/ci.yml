name: Verify marketplace
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GYG_TEST_DATABASE: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/GetYourGigs.Web/package-lock.json
      - run: dotnet test tests/GetYourGigs.Tests/GetYourGigs.Tests.csproj
      - run: npm ci --prefix src/GetYourGigs.Web
      - run: npm run test --prefix src/GetYourGigs.Web
      - run: npm run build --prefix src/GetYourGigs.Web
